<h2>Form Perpanjangan PAS</h2>


<label>Nomor PAS Lama</label>

<input type="text" id="noPas" required>

<label>Nama Lengkap</label>

<input type="text" id="nama" required>

<label>Instansi / Perusahaan</label>

<input type="text" id="instansi" required>

<label>NIK / Nomor Identitas</label>

<input type="text" id="nik" required>

<label>Jenis PAS</label>

<select id="jenisPas">

<option value="Tahunan">PAS Tahunan</option>

<option value="Bulanan">PAS Bulanan</option>

<option value="Harian">PAS Harian</option>

</select>

<label>Upload PAS Lama</label>
<input type="file" id="pasLama">

<label>Upload Surat Permohonan</label>
<input type="file" id="surat">

<label>Upload Foto 3x4</label>
<input type="file" id="foto">

<button type="submit" id="btnKirimPerpanjangan">
    Ajukan Perpanjangan
</button>

<!-- PESAN SUKSES / GAGAL -->
<div id="pesanStatusPerpanjangan"></div>

</form>

<body>

<header>

<div class="container">

<div class="logo">

<img src="logo.png" class="logo-img" alt="Logo">

<div class="judul">

</div>

</header>

<section class="form-section">

<div class="form-card">

<h2>Form Pengajuan PAS Baru</h2>

<form id="formPengajuan">

<label>Nama Lengkap</label>

<input type="text" id="nama" required>

<label>NIK</label>

<input type="text" id="nik" required>

<label>Instansi / Perusahaan</label>

<input type="text" id="instansi" required>

<label>Jabatan</label>

<input type="text" id="jabatan" required>

<label>Nomor Telepon</label>

<input type="text" id="telepon" required>

<label>Email</label>

<input type="email" id="email" required>

<label>Jenis PAS</label>

<select id="jenisPas">

<option value="">-- Pilih Jenis PAS --</option>

<option>Harian</option>

<option>Mingguan</option>

<option>Bulanan</option>

<option>Tahunan</option>

</select>

<h3>Upload Dokumen</h3>

<label>Pas Foto</label>

<input type="file" id="foto">

<label>Fotokopi KTP</label>

<input type="file" id="ktp">

<label>Surat Permohonan</label>

<input type="file" id="permohonan">

<label>Surat Pernyataan</label>

<input type="file" id="pernyataan">

<label>Daftar Riwayat Hidup (DRH)</label>

<input type="file" id="drh">

<label>SKCK</label>

<input type="file" id="skck">

<button type="submit">

Kirim Pengajuan

</button>

</form>

</div>

</section>

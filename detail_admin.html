<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Pengajuan | E-PAS</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="main">

<div class="header">

<h1>Detail Pengajuan PAS</h1>

<p>Bandar Udara Rahadi Oesman Ketapang</p>

</div>

<div class="tabel">

<table>

<tr>

<th width="35%">Data</th>

<th>Informasi</th>

</tr>

<tr>

<td>Nama</td>

<td id="nama"></td>

</tr>

<tr>

<td>Instansi</td>

<td id="instansi"></td>

</tr>

<tr>

<td>Jabatan</td>

<td id="jabatan"></td>

</tr>

<tr>

<td>Jenis PAS</td>

<td id="jenisPas"></td>

</tr>

<tr>

<td>Nomor HP</td>

<td id="telepon"></td>

</tr>

<tr>

<td>Email</td>

<td id="email"></td>

</tr>

<tr>

<td>Status</td>

<td id="status"></td>

</tr>

</table>

<br>

<button class="btn-setuju" onclick="setujui()">

Setujui

</button>

<button class="btn-tolak" onclick="tolak()">

Tolak

</button>

<a href="admin.html">

<button class="btn-detail">

Kembali

</button>

</a>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("detailPAS"));

let index = localStorage.getItem("indexPAS");

if(data){

document.getElementById("nama").innerHTML = data.nama;

document.getElementById("instansi").innerHTML = data.instansi;

document.getElementById("jabatan").innerHTML = data.jabatan;

document.getElementById("jenisPas").innerHTML = data.jenisPas;

document.getElementById("telepon").innerHTML = data.telepon;

document.getElementById("email").innerHTML = data.email;

document.getElementById("status").innerHTML = data.status;

}

function setujui(){

let daftar = JSON.parse(localStorage.getItem("daftarPAS"));

daftar[index].status = "Disetujui";

localStorage.setItem("daftarPAS",JSON.stringify(daftar));

alert("Pengajuan berhasil disetujui.");

window.location.href="admin.html";

}

function tolak(){

let daftar = JSON.parse(localStorage.getItem("daftarPAS"));

daftar[index].status = "Ditolak";

localStorage.setItem("daftarPAS",JSON.stringify(daftar));

alert("Pengajuan berhasil ditolak.");

window.location.href="admin.html";

}

</script>

</body>

</html>
